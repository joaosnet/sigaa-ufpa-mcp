[project]
name = "sigaa-ufpa-mcp"
version = "2.0.0"
description = "Deterministic Zero-Token MCP Server & Interactive MCP Apps for UFPA SIGAA academic automation powered by FastMCP 4 and Playwright."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastmcp[apps]>=4.1.6",
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "lxml>=6.1.3",
    "playwright>=1.64.1",
    "prefab-ui>=0.21.1",
    "pydantic>=2.14.3",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.37.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
