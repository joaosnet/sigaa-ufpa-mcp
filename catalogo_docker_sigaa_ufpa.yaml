name: sigaa-ufpa
description: Servidor MCP determinístico Zero-Token com FastMCP 4.1 Apps e Login Visual para automação acadêmica no SIGAA da UFPA
displayName: SIGAA UFPA MCP
registry:
  sigaa-ufpa:
    dateAdded: "2025-09-30T17:20:00Z"
    description: Servidor MCP determinístico Zero-Token para automação do Portal do Discente SIGAA UFPA com Playwright, FastMCP 4.1, MCP Apps interativos e Login Visual seguro
    icon: https://avatars.githubusercontent.com/u/182288589?s=200&v=4
    image: joaosnet/sigaa-ufpa-mcp
    metadata:
      category: automation
      license: MIT
      owner: joaosnet
      tags:
        - sigaa
        - ufpa
        - mcp-apps
        - fastmcp
        - playwright
        - education
    prompts: 3
    readme: https://github.com/joaosnet/sigaa-ufpa-mcp/blob/main/README.md
    ref: ""
    resources:
      - uri: resource://status-init
      - uri: resource://drive-images
      - uri: resource://downloads
      - uri: resource://downloads/{filename}
    secrets:
      - env: MCP_TRANSPORT
        example: http
        name: sigaa-ufpa.mcp_transport
      - env: SIGAA_USERNAME
        example: seu.usuario.ufpa
        name: sigaa-ufpa.username
      - env: SIGAA_PASSWORD
        example: suaSenhaSegura123
        name: sigaa-ufpa.password
      - env: VNC_PASSWORD
        example: sigaa
        name: sigaa-ufpa.vnc_password
    source: https://github.com/joaosnet/sigaa-ufpa-mcp
    title: SIGAA UFPA MCP
    tools:
      - name: baixar_historico_escolar
      - name: emitir_atestado_matricula
      - name: consultar_notas_frequencia
      - name: listar_atividades_pendentes
      - name: exportar_horarios_csv
      - name: listar_avisos_turmas
      - name: listar_disciplinas_ofertadas
      - name: trocar_imagem_perfil
      - name: reiniciar_sessao
      - name: encerrar_sessao
      - name: abrir_login_sigaa
      - name: abrir_painel_academico
      - name: abrir_explorador_turmas
      - name: abrir_estudio_perfil
    toolsUrl: ""
    type: server
    upstream: ""
